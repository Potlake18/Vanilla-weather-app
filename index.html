<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="src/style.css" />
        <title>SheCodes project</title>
    </head>

    <body>
        <div class="weather-app">
            <header>
                <form class="search-form" id="search-form">
                    <input type="search" placeholder="Enter a city..." required class="search-form-input"
                        id="search-form-input" />
                    <input type="submit" value="Search" class="search-form-button" />
                </form>
            </header>
            <main>
                <div class="weather-app-data">
                    <div>
                        <h1 class="weather-app-city" id="city">Johannesburg</h1>
                        <p class="weather-app-details">
                            Tuesday 14:49, scattered clouds
                            <br />
                            Humidity: 66%, Wind: 3.13km/h
                        </p>
                    </div>
                    <div class="weather-app-temperature-container">
                        <div class="weather-app-icon">🌤️</div>
                        <div class="weather-app-temperature">12</div>
                        <div class="weather-app-unit">°C</div>
                    </div>
                </div>
            </main>
            <footer>This project is coded by
                <a href="https://github.com/Potlake18" target="_blank"> Miracle Sekome </a> and hosted on <a
                    href="https://github.com/Potlake18/Vanilla-weather-app" target="_blank">
                    Github </a> and website hosted on <a href="https://ephemeral-tiramisu-535e4d.netlify.app/"
                    target="_blank"> Netlify </a>
            </footer>
        </div>
    </body>
    <script src="src/javascript.js"></script>

</html>
